[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flowjury"
version = "0.2.0"
description = "A DataHub-powered, skill-guided pipeline decision agent"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
  "acryl-datahub==1.6.0.6",
  "anthropic>=0.49,<1",
  "datahub-agent-context==1.6.0.6",
  "langgraph>=1.0,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "PyYAML>=6,<7",
]

[project.scripts]
flowjury = "flowjury.cli:main"

[tool.setuptools.packages.find]
include = ["flowjury*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.black]
line-length = 100
target-version = ["py311"]
